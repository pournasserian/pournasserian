name: Contribution heatmap

on:
  schedule:
    - cron: "17 5 * * *" # daily at 05:17 UTC, shortly after midnight in Toronto
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Draw the heatmap SVGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/heatmap.py "${{ github.repository_owner }}" assets

      - name: Commit the SVGs if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heatmap-dark.svg assets/heatmap-light.svg
          git diff --cached --quiet || (git commit -m "Update contribution heatmap" && git push)
